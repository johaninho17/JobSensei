name: Verify source release

# One verify run per PR commit: pushes run only on main, a newer push cancels the older run,
# and a change only to tasks/ (the generated issue index) skips it; the local gate still runs the privacy scan on it. The PR title check lives in pr-title.yml.
on:
  push:
    branches: [main]
    paths-ignore: ['tasks/**']
  pull_request:
    paths-ignore: ['tasks/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # The recruiter edition must build too, with its left-out screens absent from the bundle (tests/edition.test.ts).
      - run: npm run build
        env:
          JOBSENSEI_EDITION: recruiter
      - run: npx vitest run tests/edition-bundle.test.ts
        env:
          JOBSENSEI_EDITION: recruiter
