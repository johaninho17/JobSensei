name: Verify source release

on:
  push:
  pull_request:

jobs:
  pr-title:
    # Titles follow <type>(<scope>): <summary> (refs #N); scripts/issue-lib.mjs owns the pattern.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-title.mjs "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # The recruiter edition must build too, with its left-out screens absent from the bundle (tests/edition.test.ts).
      - run: npm run build
        env:
          JOBSENSEI_EDITION: recruiter
      - run: npx vitest run tests/edition-bundle.test.ts
        env:
          JOBSENSEI_EDITION: recruiter
