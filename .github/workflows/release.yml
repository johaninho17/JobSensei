name: Release Desktop Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create draft release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch and bundle Antigravity CLI for ${{ matrix.platform }}
        run: node scripts/prepare-bundled-binaries.mjs --platform=${{ matrix.platform }}

      - name: Run test suite
        run: npm run test

      - name: Build application bundle
        run: npm run build

      - name: Configure macOS signing (only when secrets exist)
        if: matrix.platform == 'mac'
        shell: bash
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        # An empty CSC_LINK is read as a file path and fails the build, so variables are set only
        # when the secrets exist (docs/release-signing.md). Otherwise the app is ad-hoc signed.
        run: |
          if [ -n "$P12" ]; then
            echo "CSC_LINK=$P12" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$P12_PASSWORD" >> "$GITHUB_ENV"
          fi
          if [ -n "$NOTARY_ID" ]; then
            echo "APPLE_ID=$NOTARY_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$NOTARY_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$NOTARY_TEAM" >> "$GITHUB_ENV"
          fi

      - name: Package and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --publish always
