name: Release Desktop Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create draft release'
        required: false
        default: false
        type: boolean
      test_only:
        description: 'Build and smoke-test every installer without publishing anything'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # Create the draft once, so the Mac and Windows builds upload to the same release
  # (when both create it at the same time, GitHub ends up with two drafts for one tag).
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release for this tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "JobSensei ${TAG#v}" --notes "Installers for macOS and Windows. See the README for the one-time trust step."
          fi

  release:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        # One tag builds every edition on every platform into the same draft release (src/shared/edition.ts).
        include:
          - { os: macos-latest, platform: mac, edition: solo }
          - { os: windows-latest, platform: win, edition: solo }
          - { os: macos-latest, platform: mac, edition: recruiter }
          - { os: windows-latest, platform: win, edition: recruiter }
    runs-on: ${{ matrix.os }}
    env:
      JOBSENSEI_EDITION: ${{ matrix.edition }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch and bundle Antigravity CLI for ${{ matrix.platform }}
        run: node scripts/prepare-bundled-binaries.mjs --platform=${{ matrix.platform }}

      # The suite covers both editions itself, so it runs without the job's edition (as in ci.yml); only the
      # build and packaging below use it. Forcing the whole suite into the Recruiter Edition fails the regular
      # app's own tests by design.
      - name: Run test suite
        run: npm run test
        env:
          JOBSENSEI_EDITION: ""

      - name: Build application bundle
        run: npm run build

      - name: Record the release source for the update notice
        shell: bash
        run: |
          printf '{"repository":"%s"}\n' "$GITHUB_REPOSITORY" > dist-electron/release-source.json

      - name: Configure macOS signing (only when secrets exist)
        if: matrix.platform == 'mac'
        shell: bash
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        # An empty CSC_LINK is read as a file path and fails the build, so variables are set only
        # when the secrets exist (docs/release-signing.md). Otherwise the app is ad-hoc signed.
        run: |
          if [ -n "$P12" ]; then
            echo "CSC_LINK=$P12" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$P12_PASSWORD" >> "$GITHUB_ENV"
          fi
          if [ -n "$NOTARY_ID" ]; then
            echo "APPLE_ID=$NOTARY_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$NOTARY_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$NOTARY_TEAM" >> "$GITHUB_ENV"
          fi

      - name: Package and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --config build-config/edition.cjs --publish ${{ inputs.test_only && 'never' || 'always' }}

      # Opens the packaged app on this OS with an empty workspace and fails if the window doesn't render.
      # The release stays a draft until this passes on both platforms.
      - name: Smoke-test the packaged app
        shell: bash
        run: node scripts/smoke-packaged.mjs
